name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
      - name: License manifests
        run: politybench build-manifests
      - name: Tests
        run: pytest
      - name: Deterministic replay + smoke
        run: |
          politybench benchmark-smoke --fidelity F0 --seeds 2
          politybench calibrate-smoke
      - name: Scenario regression (F0)
        run: |
          for s in baseline_development macro_fiscal_crisis pandemic_information_stress compound_disaster; do
            politybench run-scenario --scenario "$s" --fidelity F0 --seed 7 --agent rule_based --out "benchmarks/results/${s}_smoke.json"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/demo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
