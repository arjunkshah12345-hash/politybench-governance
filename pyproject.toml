[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "politybench"
version = "0.1.0"
description = "Research-grade benchmark for AI country-level governance under uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PolityBench Research" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "duckdb>=0.10",
  "pyarrow>=15.0",
  "pandas>=2.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.98",
  "ruff>=0.3",
  "mypy>=1.8",
]
rl = [
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
]

[project.scripts]
politybench = "politybench_core.cli:app"

[tool.setuptools.packages.find]
where = [
  "packages/core-sim",
  "packages/datasets",
  "packages/scenarios",
  "packages/agent-api",
  "packages/evaluator",
  ".",
]
include = [
  "politybench_core*",
  "politybench_datasets*",
  "politybench_scenarios*",
  "politybench_api*",
  "politybench_eval*",
  "calibration*",
]

[tool.setuptools.package-data]
politybench_datasets = ["fixtures/*.json", "manifests/*.json"]

[tool.pytest.ini_options]
testpaths = [
  "packages/core-sim/tests",
  "packages/datasets/tests",
]
pythonpath = [
  "packages/core-sim",
  "packages/datasets",
  "packages/scenarios",
  "packages/agent-api",
  "packages/evaluator",
  ".",
]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
